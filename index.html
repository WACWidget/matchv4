<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#39445f">
  <title>WATC Play Chess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="widget" aria-label="WE ARE THE CHAMPIONS Play Chess widget">
    <header class="widget-header">
      <span class="header-bolt">ϟ</span>
      <span>Play Chess</span>
      <span class="header-trophy">♟</span>
    </header>

    <section class="section daily-section">
      <div class="section-icon-wrap">
        <img class="section-icon daily-icon"
             src="https://www.chess.com/bundles/web/images/color-icons/daily.svg"
             alt="" onerror="this.style.display='none'">
      </div>
      <div class="tabs daily-tabs" role="tablist" aria-label="Daily match category">
        <button class="tab active" id="leagueTab" role="tab" aria-selected="true">League</button>
        <button class="tab" id="friendlyTab" role="tab" aria-selected="false">Friendly</button>
      </div>
      <div class="cards" id="dailyCards" aria-live="polite">
        <div class="loading-card">Loading daily matches…</div>
      </div>
    </section>

    <section class="section arena-section">
      <div class="arena-heading">
        <img class="section-icon arena-icon"
             src="https://www.chess.com/bundles/web/images/color-icons/arena-club-multi.svg"
             alt="" onerror="this.style.display='none'">
        <div class="tabs arena-tabs" role="tablist" aria-label="Arena status">
          <button class="tab active" id="currentTab" role="tab" aria-selected="true">Current</button>
          <button class="tab" id="upcomingTab" role="tab" aria-selected="false">Upcoming</button>
        </div>
      </div>
      <div class="cards arena-cards" id="arenaCards" aria-live="polite"></div>
    </section>

    <footer class="widget-footer">
      <span id="syncStatus">Connecting to Chess.com…</span>
      <button id="refreshButton" class="refresh-button" type="button" title="Refresh">↻</button>
    </footer>
  </main>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
